# SLAM map of worlds/new_world.world, from Language-Grounded-Robot-Autonomy.
# The original was georeferenced to its own SLAM start frame, which sits a
# quarter turn from the Gazebo world frame: live scans matched it only 1.2%
# as shipped, and 87% after a fitted dx=+1.05 dy=-3.00 dyaw=-90.00 correction.
# The image has been rotated a quarter turn and the origin recomputed so the
# map is axis-aligned with the world and needs no origin yaw.
image: custom_map.pgm
mode: trinary
resolution: 0.05
origin: [-10.2701, -5.2816, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
