amcl:
  ros__parameters:
    use_sim_time: true
    # Odometry noise model. These are measured, not guessed, and the
    # measurement contradicted the obvious reasoning -- see below.
    #
    # Rotation is the motion that wrecks localisation here. Seeding from
    # ground truth and then turning gives, per step:
    #
    #   just seeded          err 0.014 m   yaw  -0.1 deg   sigma_yaw 0.128
    #   8 s standing still   err 0.015 m   yaw  -0.1 deg   sigma_yaw 0.128
    #   one 90 deg turn      err 0.159 m   yaw -17.4 deg   sigma_yaw 1.189
    #
    # One turn multiplies yaw sigma nine-fold; standing still and driving
    # straight cost nothing, and translation actually pulls sigma back down.
    #
    # The tempting inference is that rotation is unreliable -- the casters
    # are fixed rather than swivelling and scrub 180-220 mm per turn -- so
    # alpha1 should be raised to admit it. That was tried at 0.25 and is
    # exactly backwards. These alphas are variances on a noise term
    # proportional to the rotation itself, so a large alpha1 makes each
    # update spray particles across a wide arc, and the arc grows faster
    # than one scan update can pull it back. Sweeping the value over a
    # 90 deg turn, seeding from truth each time:
    #
    #   alpha1/2   pos err   yaw err   sigma_yaw
    #     0.25     0.469 m    -13.3      1.257
    #     0.10     0.279 m     -9.5      0.958
    #     0.05     0.168 m     +1.0      0.694
    #     0.02     0.108 m     -2.8      0.441
    #     0.01     0.104 m     -1.8      0.364
    #
    # Monotonic, and flattening below 0.02. 0.02 is taken rather than 0.01
    # to keep some genuine rotational noise in the model: the scrub is real,
    # and a filter that believes its odometry perfectly has no way to accept
    # a correction when it is finally wrong.
    alpha1: 0.02   # rotation noise from rotation
    alpha2: 0.02   # rotation noise from translation
    alpha3: 0.05   # translation noise from translation
    alpha4: 0.05   # translation noise from rotation
    alpha5: 0.05
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false
    tf_broadcast: true
    transform_tolerance: 1.0
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.25
    update_min_a: 0.2
    resample_interval: 1
    # Divergence recovery, deliberately OFF.
    #
    # Enabling it (0.001 / 0.1, the values everyone quotes) made things
    # markedly worse here. It scatters random particles across the map
    # whenever the fast weight average dips below the slow one, and the
    # pose AMCL reports is the mean over every particle, so the injected
    # spread drags the estimate off a cluster that was perfectly good. The
    # symptom is unmistakable: yaw sigma reached 2.53 rad, near-uniform
    # over a full circle, while the robot sat 8.5 m from where AMCL said.
    #
    # The case for enabling it does not apply to this robot. Recovery earns
    # its keep when a scan is ambiguous and the filter can genuinely back
    # the wrong hypothesis. Measured against this map, a scan taken at the
    # true pose puts 100% of beams within 20 cm of a wall and has one sharp
    # global minimum -- mean error 0.047 m at the correct heading against
    # 0.41-0.76 m at every 45 deg offset. There is no second hypothesis to
    # find. If localisation is ever genuinely lost, re-seed it with
    # scripts/seed.sh or RViz's 2D Pose Estimate.
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    laser_min_range: 0.15
    # The scanner reaches 16 m and the building is 13.9 m across, so an 8 m
    # cutoff discarded exactly the long returns that pin position down along
    # a corridor. Match the sensor.
    laser_max_range: 16.0
    # 720 beams are available; 60 was leaving the likelihood peak shallower
    # than it needs to be for the cost.
    max_beams: 120
    # Measured trust in the scan. z_hit and z_rand are the weights on "this
    # beam hit the wall the map predicts" against "this beam is noise", and
    # a flat 0.5/0.5 says half of every scan is meaningless. Against this
    # map it is not: 100% of beams at the true pose fall within 20 cm of a
    # wall, mean 4.7 cm. Weighting the informative term properly sharpens
    # the likelihood peak, so the filter both converges faster and holds on
    # to the correct hypothesis under the odometry noise the alphas admit.
    z_hit: 0.8
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.2
    sigma_hit: 0.2
    lambda_short: 0.1

