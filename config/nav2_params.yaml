controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Restored to 0.35 once the tipping was fixed at its source: ROMR had no
      # rear caster, so it pivoted nose-up about the wheel axle on contact.
      # With one added, the tip rig measures 10.5 deg of pitch here (was 50.2
      # and over) and it stays upright even at 0.45.
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # ROMR is not circular: 0.521 m long x 0.608 m wide, measured from the
      # link meshes plus joint offsets (the wheels are 0.119 m thick each and
      # reach y=+/-0.304, well outside the 0.185 body edge). As a circle it has
      # a 0.422 m circumscribed radius and would demand 0.84 m passages, which
      # blocked planning through this building's doorways. A footprint polygon
      # gives an inscribed radius of 0.229 and orientation-aware checking.
      footprint: "[[0.292, 0.304], [0.292, -0.304], [-0.229, -0.304], [-0.229, 0.304]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # Mark near, clear far. Marking out to 7.5 m meant small AMCL yaw
          # errors placed distant wall returns a few cells off the true wall,
          # leaving thin "ghost walls" beside real ones. They accumulated until
          # doorways pinched shut and the planner boxed the robot in -- 2332
          # lethal cells, 41% of the live costmap, were marks with no
          # counterpart in the map, almost all of them wall-parallel lines.
          # Marking only within 3 m keeps returns where localisation error is
          # small; raytracing to 10 m still clears stale marks at a distance.
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Cost decays as 252 * exp(-scaling * (clearance - inscribed_radius)),
        # and is a flat 253 -- treated as an obstacle -- inside the inscribed
        # radius of 0.229 m. Only that inner band blocks anything; the rest
        # just makes routes expensive. What matters is how fast it decays.
        #
        # At 3.0 the decay was far too slow to sit under a 0.45 m radius: a
        # spot with 0.30 m of clearance, which this robot passes through
        # comfortably, cost 203 of a possible 253, and 0.40 m still cost 150.
        # Nearly every corridor in the house was priced as almost-lethal, so
        # the planner had no cheap route anywhere and DWB scored real
        # trajectories against a gradient that never flattened out.
        #
        # Worse, cost fell from 130 straight to 0 at the 0.45 m edge -- a
        # cliff in open floor that is not a real feature of the world.
        #
        # 6.0 with a wider 0.55 m radius is cheaper everywhere the robot
        # actually drives (0.30 m -> 164, 0.40 m -> 90) while the band now
        # comfortably covers the 0.422 m circumscribed radius, which is the
        # distance nav2 needs to reason about collisions that depend on
        # heading. The edge discontinuity drops from 130 to 36.
        cost_scaling_factor: 6.0
        inflation_radius: 0.55

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # ROMR is not circular: 0.521 m long x 0.608 m wide, measured from the
      # link meshes plus joint offsets (the wheels are 0.119 m thick each and
      # reach y=+/-0.304, well outside the 0.185 body edge). As a circle it has
      # a 0.422 m circumscribed radius and would demand 0.84 m passages, which
      # blocked planning through this building's doorways. A footprint polygon
      # gives an inscribed radius of 0.229 and orientation-aware checking.
      footprint: "[[0.292, 0.304], [0.292, -0.304], [-0.229, -0.304], [-0.229, 0.304]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # Mark near, clear far. Marking out to 7.5 m meant small AMCL yaw
          # errors placed distant wall returns a few cells off the true wall,
          # leaving thin "ghost walls" beside real ones. They accumulated until
          # doorways pinched shut and the planner boxed the robot in -- 2332
          # lethal cells, 41% of the live costmap, were marks with no
          # counterpart in the map, almost all of them wall-parallel lines.
          # Marking only within 3 m keeps returns where localisation error is
          # small; raytracing to 10 m still clears stale marks at a distance.
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Cost decays as 252 * exp(-scaling * (clearance - inscribed_radius)),
        # and is a flat 253 -- treated as an obstacle -- inside the inscribed
        # radius of 0.229 m. Only that inner band blocks anything; the rest
        # just makes routes expensive. What matters is how fast it decays.
        #
        # At 3.0 the decay was far too slow to sit under a 0.45 m radius: a
        # spot with 0.30 m of clearance, which this robot passes through
        # comfortably, cost 203 of a possible 253, and 0.40 m still cost 150.
        # Nearly every corridor in the house was priced as almost-lethal, so
        # the planner had no cheap route anywhere and DWB scored real
        # trajectories against a gradient that never flattened out.
        #
        # Worse, cost fell from 130 straight to 0 at the 0.45 m edge -- a
        # cliff in open floor that is not a real feature of the world.
        #
        # 6.0 with a wider 0.55 m radius is cheaper everywhere the robot
        # actually drives (0.30 m -> 164, 0.40 m -> 90) while the band now
        # comfortably covers the 0.422 m circumscribed radius, which is the
        # distance nav2 needs to reason about collisions that depend on
        # heading. The edge discontinuity drops from 130 to 36.
        cost_scaling_factor: 6.0
        inflation_radius: 0.55

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 1.0]
    min_velocity: [-0.20, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
