name: small_house
description: AWS RoboMaker small house mapped environment for the ROMR custom robot

simulation:
  world_name: small_house
  world_path: /home/promise/turtlebot3_ws/src/aws-robomaker-small-house-world/worlds/small_house.world
  house_models_path: /home/promise/turtlebot3_ws/src/aws-robomaker-small-house-world/models
  robot_models_path: /home/promise/turtlebot3_ws/install/multimodal_robot_autonomy/share/multimodal_robot_autonomy/models

robot:
  model: romr
  entity_name: romr
  # ROMR is spawned from robot_description (xacro), not from a static SDF.
  description_path: /home/promise/Multimodal-Robot-Autonomy/urdf/romr.urdf.xacro
  spawn_pose:
    x: -3.5
    y: 1.0
    z: 0.20
    yaw: 0.02

navigation:
  use_sim_time: true
  map_yaml_path: /home/promise/Multimodal-Robot-Autonomy/maps/small_house_map.yaml
  initial_pose:
    x: -3.52
    y: 0.90
    yaw: 0.0228
    covariance:
      x: 0.1
      y: 0.1
      yaw: 0.03

places_file: /home/promise/Multimodal-Robot-Autonomy/backend/app/data/places/small_house_places.yaml