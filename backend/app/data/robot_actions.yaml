# Places here MUST match app/data/places/<environment>_places.yaml.
# Two registries feed different paths: /api/navigation resolves places via the
# environment config, while the chat/action-mapper path reads this file. They
# disagreed once and a chat command sent the robot to (10.94, -2.04) -- an
# AWS small-house pose, far outside the new_world map.
# Regenerate from the environment places file when the environment changes.

places:
  parlour:
    aliases:
    - parlour
    - living room
    - lounge
    - sitting room
    pose:
      x: -5.9101
      y: -3.3416
      yaw: -1.57239
  kitchen:
    aliases:
    - kitchen
    pose:
      x: -8.9101
      y: -4.3416
      yaw: -1.57239
  dining_room:
    aliases:
    - dining room
    - dining area
    pose:
      x: -8.9101
