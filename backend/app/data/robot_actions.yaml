motions:
  move_forward:
    aliases:
    - move forward
    - go forward
    - forward
    cmd_vel:
      linear_x: 0.2
      angular_z: 0.0
      duration_sec: 2.0
  move_backward:
    aliases:
    - move backward
    - go backward
    - reverse
    - backward
    cmd_vel:
      linear_x: -0.2
      angular_z: 0.0
      duration_sec: 2.0
  turn_left:
    aliases:
    - turn left
    - go left
    - left
    cmd_vel:
      linear_x: 0.0
      angular_z: 0.6
      duration_sec: 1.5
  turn_right:
