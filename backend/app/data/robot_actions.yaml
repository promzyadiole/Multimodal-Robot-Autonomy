    - turn right
    - go right
    - right
    cmd_vel:
      linear_x: 0.0
      angular_z: -0.6
      duration_sec: 1.5
  rotate:
    aliases:
    - rotate
    - spin
    - turn around
    - rotate in place
    cmd_vel:
      linear_x: 0.0
      angular_z: 0.8
      duration_sec: 3.5
  stop:
    aliases:
    - stop
    - halt
    - freeze
    cmd_vel:
      linear_x: 0.0
      angular_z: 0.0
      duration_sec: 0.0
